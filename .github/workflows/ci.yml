name: CI

on:
  push:
    branches: [ main, milestone3-sync ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore CivicConnect.sln

      - name: Build
        run: dotnet build CivicConnect.sln --no-restore --configuration Release

      - name: Run automated tests
        run: dotnet test CivicConnect.sln --no-build --configuration Release --verbosity normal

      - name: Check for vulnerable packages
        run: dotnet list CivicConnect.sln package --vulnerable --include-transitive